<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>French Verbs</title>
<script>try{var t=JSON.parse(localStorage.getItem("frverb-settings-v1")||"{}").theme;if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="French Verbs">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#ffffff;--bg2:#f5f5f5;--bg3:#ebebeb;
  --text:#111111;--text2:#555555;--text3:#888888;
  --border:#e0e0e0;--border2:#cccccc;
  --info-bg:#e8f0fe;--info-text:#1a56db;--info-border:#3b82f6;
  --success-bg:#e8f5e9;--success-text:#1b5e20;--success-border:#4caf50;
  --danger-bg:#fde8e8;--danger-text:#7f1d1d;--danger-border:#ef4444;
  --warn-bg:#fff8e1;--warn-text:#7c4a00;--warn-border:#f59e0b;
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#1e1e1e;--bg2:#2a2a2a;--bg3:#333333;
    --text:#f0f0f0;--text2:#aaaaaa;--text3:#666666;
    --border:#3a3a3a;--border2:#555555;
    --info-bg:#1e3a5f;--info-text:#93c5fd;--info-border:#3b82f6;
    --success-bg:#14381a;--success-text:#86efac;--success-border:#4ade80;
    --danger-bg:#3b1a1a;--danger-text:#fca5a5;--danger-border:#f87171;
    --warn-bg:#3b2a00;--warn-text:#fcd34d;--warn-border:#f59e0b;
  }
}
:root[data-theme="dark"]{color-scheme:dark;
    --bg:#1e1e1e;--bg2:#2a2a2a;--bg3:#333333;
    --text:#f0f0f0;--text2:#aaaaaa;--text3:#666666;
    --border:#3a3a3a;--border2:#555555;
    --info-bg:#1e3a5f;--info-text:#93c5fd;--info-border:#3b82f6;
    --success-bg:#14381a;--success-text:#86efac;--success-border:#4ade80;
    --danger-bg:#3b1a1a;--danger-text:#fca5a5;--danger-border:#f87171;
    --warn-bg:#3b2a00;--warn-text:#fcd34d;--warn-border:#f59e0b;
  }
:root[data-theme="light"]{color-scheme:light;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;padding:0;}
.container{max-width:780px;margin:0 auto;padding:1.5rem 1rem;}
h1{font-size:22px;font-weight:500;margin-bottom:0.25rem;}
.subtitle{font-size:13px;color:var(--text2);margin-bottom:1.5rem;}
.mode-bar{display:flex;gap:8px;margin-bottom:1rem;}
.mode-btn{flex:1;padding:10px;border:0.5px solid var(--border2);background:transparent;border-radius:var(--radius);font-size:14px;cursor:pointer;color:var(--text);transition:all 0.15s;}
.mode-btn.active{background:var(--info-bg);color:var(--info-text);border-color:var(--info-border);font-weight:500;}
.mode-btn:hover:not(.active){background:var(--bg2);}
.top-bar{display:flex;gap:10px;align-items:center;margin-bottom:1rem;flex-wrap:wrap;}
.score-pill{padding:3px 10px;border-radius:20px;font-weight:500;font-size:13px;}
.score-pill.good{background:var(--success-bg);color:var(--success-text);}
.score-pill.bad{background:var(--danger-bg);color:var(--danger-text);}
.stats-btn{margin-left:auto;padding:6px 14px;border-radius:var(--radius);border:0.5px solid var(--border2);background:transparent;font-size:13px;cursor:pointer;color:var(--text2);}
.stats-btn:hover{background:var(--bg2);color:var(--text);}
.tense-filter{margin-bottom:1.25rem;}
.tense-filter-label{font-size:12px;color:var(--text2);margin-bottom:8px;}
.tense-chips{display:flex;flex-wrap:wrap;gap:6px;}
.tense-chip{padding:5px 13px;border-radius:20px;font-size:12px;cursor:pointer;transition:all 0.15s;border:1.5px solid var(--border2);background:transparent;color:var(--text2);}
.tense-chip:hover{border-color:var(--text2);color:var(--text);}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1rem;}
.verb-header{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.verb-display{font-size:28px;font-weight:500;}
.verb-meaning{font-size:14px;color:var(--info-text);font-style:italic;margin-bottom:2px;}
.verb-translation{font-size:13px;color:var(--text2);margin-bottom:1rem;}
.verb-sub{font-size:15px;font-weight:500;margin-bottom:1.25rem;}
.tenses-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;}
.tense-block{background:var(--bg2);border-radius:var(--radius);padding:10px 12px;}
.tense-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;font-weight:500;}
.pronoun-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.pronoun-row:last-child{margin-bottom:0;}
.pronoun{font-size:12px;color:var(--text2);min-width:46px;flex-shrink:0;}
.conj-input{flex:1;min-width:0;border:0.5px solid var(--border);border-radius:4px;padding:4px 7px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit;outline:none;}
.conj-input:focus{border-color:var(--info-border);}
.conj-input.correct{background:var(--success-bg);border-color:var(--success-border);color:var(--success-text);}
.conj-input.wrong{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger-text);}
.conj-input.revealed{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text);font-style:italic;}
.speak-btn{width:22px;height:22px;min-width:22px;border-radius:50%;border:0.5px solid var(--border);background:transparent;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--text3);flex-shrink:0;}
.speak-btn:hover{background:var(--bg2);color:var(--text2);}
.speak-btn.active{color:var(--info-text);border-color:var(--info-border);background:var(--info-bg);}
.speak-btn-md{width:32px;height:32px;min-width:32px;border-radius:var(--radius);border:0.5px solid var(--border2);background:transparent;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--text2);}
.speak-btn-md:hover{background:var(--bg2);}
.speak-btn-md.active{color:var(--info-text);border-color:var(--info-border);background:var(--info-bg);}
.answer-speak{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius);border:0.5px solid var(--border2);background:transparent;cursor:pointer;font-size:13px;color:var(--text2);font-family:inherit;}
.answer-speak:hover{background:var(--bg2);}
.answer-speak.active{background:var(--info-bg);color:var(--info-text);border-color:var(--info-border);}
.btn-row{display:flex;gap:8px;margin-top:1rem;flex-wrap:wrap;align-items:center;}
.btn{padding:9px 18px;border-radius:var(--radius);border:0.5px solid var(--border2);background:transparent;font-size:14px;cursor:pointer;color:var(--text);font-family:inherit;transition:all 0.15s;}
.btn:hover{background:var(--bg2);}
.btn.primary{background:var(--info-bg);color:var(--info-text);border-color:var(--info-border);font-weight:500;}
.btn.sm{padding:6px 14px;font-size:13px;}
.btn.danger{color:var(--danger-text);border-color:var(--danger-border);}
.m2-input-wrap{display:flex;gap:8px;align-items:center;}
.m2-input{flex:1;min-width:0;padding:10px 14px;border:0.5px solid var(--border2);border-radius:var(--radius);font-size:16px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;}
.m2-input:focus{border-color:var(--info-border);}
.m2-input.correct{background:var(--success-bg);border-color:var(--success-border);color:var(--success-text);}
.m2-input.wrong{background:var(--danger-bg);border-color:var(--danger-border);color:var(--danger-text);}
.m2-input.revealed{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text);font-style:italic;}
.feedback{margin-top:0.75rem;font-size:14px;min-height:20px;}
.feedback.ok{color:var(--success-text);font-weight:500;}
.feedback.err{color:var(--danger-text);}
.accent-hint{font-size:11px;color:var(--text3);margin-top:6px;}
.srs-badge{font-size:11px;color:var(--text3);padding:2px 8px;border:0.5px solid var(--border);border-radius:10px;}
.filter-badge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--warn-bg);color:var(--warn-text);}
/* Stats overlay */
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:100;overflow-y:auto;}
.overlay-inner{max-width:780px;margin:0 auto;padding:1.5rem 1rem;}
.overlay-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
.overlay-title{font-size:18px;font-weight:500;}
.close-btn{padding:6px 14px;border:0.5px solid var(--border2);border-radius:var(--radius);background:transparent;cursor:pointer;font-size:13px;color:var(--text2);font-family:inherit;}
.metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.25rem;}
.metric{background:var(--bg2);border-radius:var(--radius);padding:10px 12px;text-align:center;}
.metric-val{font-size:22px;font-weight:500;}
.metric-lbl{font-size:11px;color:var(--text2);margin-top:2px;}
.section-title{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.04em;}
.day-bars{display:flex;align-items:flex-end;gap:3px;height:90px;margin-bottom:24px;}
.day-bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:2px;}
.bar-seg{width:100%;border-radius:2px 2px 0 0;min-height:3px;}
.day-label{font-size:9px;color:var(--text3);white-space:nowrap;}
.tense-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:1.5rem;}
.tense-row{display:flex;align-items:center;gap:10px;}
.tense-name{font-size:13px;min-width:170px;}
.tense-bar-wrap{flex:1;height:16px;background:var(--bg2);border-radius:8px;overflow:hidden;}
.tense-bar-fill{height:100%;border-radius:8px;}
.tense-stat{font-size:12px;color:var(--text2);min-width:80px;text-align:right;}
.no-data{font-size:13px;color:var(--text3);text-align:center;padding:2rem 0;}
/* iPhone home-screen app */
html{-webkit-text-size-adjust:100%;}
button{-webkit-tap-highlight-color:transparent;}
.container,.overlay-inner{padding-left:max(1rem,env(safe-area-inset-left));padding-right:max(1rem,env(safe-area-inset-right));padding-top:max(1.5rem,env(safe-area-inset-top));padding-bottom:max(2rem,env(safe-area-inset-bottom));}
@supports(-webkit-touch-callout:none){input,select,textarea{font-size:16px!important;}} /* <16px makes iOS zoom in on focus */
.set-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.set-row label{font-size:13px;color:var(--text2);min-width:52px;}
.set-row select{flex:1;min-width:0;padding:7px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;}
.set-note{font-size:12px;color:var(--text3);margin:4px 0 1.25rem;}
#bk-text{width:100%;margin-top:8px;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:ui-monospace,monospace;font-size:12px;}
#bk-msg{font-size:13px;color:var(--text2);margin-top:6px;min-height:18px;}
@media(max-width:500px){
  .tenses-grid{grid-template-columns:minmax(0,1fr);}
  .tense-block{grid-column:auto!important;}
  .metrics-row{grid-template-columns:repeat(2,1fr);}
}
/* ── Mobile app layout ─────────────────────────────── */
body{font-size:16px;overscroll-behavior-y:none;touch-action:manipulation;}
.container{max-width:640px;}
.app-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.app-head h1{font-size:22px;font-weight:600;margin:0;flex:1;white-space:nowrap;}
.score{display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;}
.score-pill{font-size:14px;padding:4px 10px;}
#streak-label{font-size:14px;}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0.5px solid var(--border2);background:transparent;font-size:20px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;}
.mode-bar{gap:4px;padding:4px;background:var(--bg2);border-radius:12px;margin-bottom:10px;}
.mode-btn{min-height:40px;padding:8px 4px;border:none;border-radius:9px;font-size:15px;color:var(--text2);}
.mode-btn.active{background:var(--bg);color:var(--text);border:none;box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .mode-btn.active{background:var(--bg3);}}
:root[data-theme="dark"] .mode-btn.active{background:var(--bg3);}
.sub-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.sub-bar .srs-badge,.sub-bar .filter-badge{margin-left:auto;}
.tense-toggle{min-height:36px;padding:6px 14px;border-radius:18px;border:1.5px solid var(--border2);background:transparent;color:var(--text);font-size:14px;font-family:inherit;}
.tense-toggle.on{background:var(--info-bg);color:var(--info-text);border-color:var(--info-border);}
.tense-filter{margin-bottom:12px;}
.tense-chip{font-size:14px;padding:7px 14px;min-height:36px;}
.card{padding:1.1rem;border-radius:16px;}
.verb-header{margin-bottom:6px;}
.verb-display{font-size:34px;font-weight:600;line-height:1.15;}
.verb-meaning{font-size:16px;}
.verb-translation{font-size:15px;margin-bottom:0;}
.quiz-card .verb-meaning,.quiz-card .verb-translation{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.5em;}
.verb-sub{font-size:18px;font-weight:600;margin:8px 0 14px;}
.speak-btn-md{width:44px;height:44px;min-width:44px;border-radius:12px;font-size:18px;}
.speak-btn{width:36px;height:36px;min-width:36px;font-size:15px;}
.btn{min-height:44px;padding:10px 18px;font-size:16px;border-radius:10px;}
.btn.sm{min-height:40px;font-size:14px;}
.m2-input{font-size:18px;padding:12px 14px;min-height:50px;border-radius:10px;}
.m2-input-wrap .btn{min-height:50px;}
.feedback{font-size:16px;min-height:2.9em;margin-top:10px;}
.quiz-card .btn-row{flex-wrap:nowrap;margin-top:4px;}
.answer-slot{flex:1;min-width:0;display:flex;justify-content:center;}
.answer-speak{max-width:100%;min-height:44px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tense-label{font-size:12px;}
.pronoun{font-size:15px;min-width:58px;}
.pronoun-row{gap:8px;margin-bottom:8px;}
.conj-input{padding:8px 10px;border-radius:8px;min-height:40px;}
.tense-block{padding:12px;}
.m1-actions{flex-wrap:nowrap!important;gap:8px;position:sticky;bottom:0;z-index:5;background:var(--bg);margin-top:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));border-top:0.5px solid var(--border);}
#mode1-verb-picker{position:relative;display:flex;gap:8px;align-items:center;margin-bottom:12px;}
#mode1-verb-input{flex:1;min-width:0;padding:10px 12px;min-height:44px;border:0.5px solid var(--border2);border-radius:10px;font-size:16px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;}
#verb-suggestions{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:50;background:var(--bg);border:0.5px solid var(--border2);border-radius:10px;max-height:260px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.18);}
.verb-sugg-item{padding:12px 14px!important;font-size:16px!important;}
.close-btn{min-height:44px;padding:8px 16px;font-size:15px;}
.overlay-title{font-size:20px;font-weight:600;}
.m1-actions .btn{flex:1;padding:10px 6px;white-space:nowrap;}
#m2-check,#m3-check{min-width:104px;}
.app-head h1{font-size:21px;}
.app-head .icon-btn{width:42px;height:42px;}
.score-pill{font-size:13px;padding:3px 9px;}
[hidden]{display:none!important;}
.goal-pill,.streak-pill{font-size:13px;padding:5px 10px;border-radius:14px;background:var(--bg2);color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.goal-pill.met{color:var(--success-text);font-weight:600;}
.sub-bar{min-height:36px;}
.set-section{margin-bottom:26px;}
.set-section>.section-title{margin-bottom:4px;}
.tg{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:0.5px solid var(--border);cursor:pointer;}
.tg-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.tg-title{font-size:16px;color:var(--text);}
.tg-desc{font-size:13px;color:var(--text2);line-height:1.35;}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--border2);position:relative;flex-shrink:0;transition:background .2s;cursor:pointer;margin:0;}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s;}
.switch:checked{background:#34c759;}
.switch:checked::after{transform:translateX(20px);}
.set-pick{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:0.5px solid var(--border);}
.set-pick select{max-width:55%;padding:8px 10px;border:0.5px solid var(--border2);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;}
.pick-chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 4px;}
.pick-chip{font-size:14px;padding:7px 14px;min-height:36px;border-radius:18px;border:1.5px solid var(--border2);background:transparent;color:var(--text2);font-family:inherit;}
.pick-chip.on{background:var(--info-bg);color:var(--info-text);border-color:var(--info-border);font-weight:500;}
</style>
</head>
<body>
<div class="container">
  <header class="app-head">
    <h1>French Verbs</h1>
    <div class="score"><span class="score-pill good" id="sc-right">✓ 0</span><span class="score-pill bad" id="sc-wrong">✗ 0</span></div>
    <button class="icon-btn" onclick="openStats()" aria-label="Stats and backup">📊</button>
    <button class="icon-btn" onclick="openSettings()" aria-label="Settings">⚙️</button>
  </header>
  <div class="mode-bar">
    <button class="mode-btn active" id="btn-m1" onclick="setMode(1)">Conjugate</button>
    <button class="mode-btn" id="btn-m2" onclick="setMode(2)">Single form</button>
    <button class="mode-btn" id="btn-m3" onclick="setMode(3)">Vocab</button>
  </div>
  <div class="sub-bar" id="sub-bar">
    <button class="tense-toggle" id="tense-toggle" onclick="toggleTensePanel()" style="display:none;">Tenses: All ▾</button>
    <span style="flex:1"></span>
    <span class="goal-pill" id="goal-pill" hidden></span>
    <span class="streak-pill" id="streak-pill" hidden></span>
  </div>
  <div class="tense-filter" id="tense-filter" style="display:none;"><div class="tense-chips" id="tense-chips"></div></div>
  <div id="mode1-verb-picker">
    <input id="mode1-verb-input" placeholder="Type a verb to practice…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"
      oninput="filterVerbSuggestions()" onkeydown="verbInputKey(event)" onfocus="filterVerbSuggestions()"/>
    <button class="btn" onclick="pickRandomVerb()">Random</button>
    <div id="verb-suggestions"></div>
  </div>
  <div id="mode1-ui"></div>
  <div id="mode2-ui" style="display:none;"></div>
  <div id="mode3-ui" style="display:none;"></div>
</div>

<div class="overlay" id="stats-overlay">
  <div class="overlay-inner">
    <div class="overlay-header">
      <span class="overlay-title">Progress &amp; backup</span>
      <button class="close-btn" onclick="closeStats()">Close</button>
    </div>
    <div id="stats-content"><div class="no-data">Loading…</div></div>
    <div id="backup-content" style="margin-top:2rem;padding-top:1.25rem;border-top:0.5px solid var(--border);"></div>
  </div>
</div>

<div class="overlay" id="settings-overlay">
  <div class="overlay-inner">
    <div class="overlay-header">
      <span class="overlay-title">Settings</span>
      <button class="close-btn" onclick="closeSettings()">Done</button>
    </div>
    <div id="settings-page"></div>
  </div>
</div>

<script>
// ── SPEECH ────────────────────────────────────────────────────────────
const KS='frverb-settings-v1';let SET={voice:'',rate:0.88,autoPlay:false,autoAdvance:false,strictAccents:false,includeOn:false,pool:0,m1Tenses:null,rememberTenses:true,savedTenses:null,goal:30,theme:'system',mode:1};
try{const r=localStorage.getItem(KS);if(r)SET={...SET,...JSON.parse(r)};}catch(e){}
function saveSet(){try{localStorage.setItem(KS,JSON.stringify(SET));}catch(e){}}
let frVoices=[],frVoice=null;
function voiceScore(v){const t=(v.name+' '+v.voiceURI).toLowerCase();return(/premium/.test(t)?40:/enhanced/.test(t)?30:/compact/.test(t)?0:10)+(/^fr[-_]fr/i.test(v.lang)?100:/^fr[-_]ca/i.test(v.lang)?20:0);} // France first, then quality
function voiceLabel(v){const t=(v.name+' '+v.voiceURI).toLowerCase(),q=/premium/.test(t)?'Premium':/enhanced/.test(t)?'Enhanced':'';return v.name.replace(/\s*\((premium|enhanced)\)\s*/i,' ').trim()+(q?' ('+q+')':'')+' · '+v.lang.replace('_','-');}
function initVoice(){try{frVoices=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));frVoice=frVoices.find(x=>x.voiceURI===SET.voice)||frVoices[0]||null;}catch(e){frVoice=null;}}
if(window.speechSynthesis){speechSynthesis.addEventListener('voiceschanged',()=>{initVoice();const o=document.getElementById('stats-overlay');if(o&&o.style.display==='block')renderBackup();const so=document.getElementById('settings-overlay');if(so&&so.style.display==='block')renderSettingsPage();});initVoice();}
function speak(text,btn){
  if(!window.speechSynthesis)return;
  initVoice(); // fresh voice object: iOS can ignore a stale one
  const clean=text.replace(/^que /i,'').trim();
  document.querySelectorAll('.speak-btn.active,.speak-btn-md.active,.answer-speak.active').forEach(b=>b.classList.remove('active'));
  const say=()=>{const utt=new SpeechSynthesisUtterance(clean);utt.lang=frVoice?frVoice.lang:'fr-FR';utt.rate=SET.rate||0.88;if(frVoice)utt.voice=frVoice;
    if(btn){btn.classList.add('active');utt.onend=()=>btn.classList.remove('active');utt.onerror=()=>btn.classList.remove('active');}
    speechSynthesis.speak(utt);};
  // iOS drops an utterance queued right after cancel(), so wait a beat
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(say,80);}else say();
}
function esc(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

// ── STORAGE (localStorage for standalone file) ────────────────────────
const KD='frverb-daily-v2',KT='frverb-alltense-v2',KV='frverb-verbperf-v1';
let dailyData={},tenseData={},verbData={};
function loadAll(){
  try{const r=localStorage.getItem(KD);if(r)dailyData=JSON.parse(r);}catch(e){}
  try{const r=localStorage.getItem(KT);if(r)tenseData=JSON.parse(r);}catch(e){}
  try{const r=localStorage.getItem(KV);if(r)verbData=JSON.parse(r);}catch(e){}
  updateSrsBadge();
}
function saveAll(){
  try{localStorage.setItem(KD,JSON.stringify(dailyData));}catch(e){}
  try{localStorage.setItem(KT,JSON.stringify(tenseData));}catch(e){}
  try{localStorage.setItem(KV,JSON.stringify(verbData));}catch(e){}
}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function recordResult(verb,tk,ok){
  const t=todayStr();
  if(!dailyData[t])dailyData[t]={total:0,correct:0,byTense:{}};
  dailyData[t].total++;if(ok)dailyData[t].correct++;
  if(!dailyData[t].byTense[tk])dailyData[t].byTense[tk]={total:0,correct:0};
  dailyData[t].byTense[tk].total++;if(ok)dailyData[t].byTense[tk].correct++;
  if(!tenseData[tk])tenseData[tk]={total:0,correct:0};
  tenseData[tk].total++;if(ok)tenseData[tk].correct++;
  if(!verbData[verb])verbData[verb]={};
  if(!verbData[verb][tk])verbData[verb][tk]={total:0,correct:0};
  verbData[verb][tk].total++;if(ok)verbData[verb][tk].correct++;
  saveAll();updateSrsBadge();updateHeader();
}
function clearAllData(){
  dailyData={};tenseData={};verbData={};
  try{localStorage.removeItem(KD);localStorage.removeItem(KT);localStorage.removeItem(KV);}catch(e){}
  updateSrsBadge();renderStatsContent();updateHeader();
}

function backupText(){return JSON.stringify({app:'frverb',v:1,at:Date.now(),daily:dailyData,tense:tenseData,verb:verbData,set:SET});}
// Merge, never overwrite: for each day / tense / verb+tense keep whichever record has more attempts,
// so restoring an older backup can't wipe newer practice.
function restoreBackup(text){
  const bad="That isn't a valid backup. Paste the whole text and try again.";
  let o;try{o=JSON.parse(String(text).trim());}catch(e){return bad;}
  if(!o||o.app!=='frverb'||typeof o.tense!=='object')return bad;
  const ok=r=>r&&typeof r.total==='number'&&typeof r.correct==='number';
  const newer=(cur,r)=>ok(r)&&(!cur||r.total>cur.total);
  let n=0;
  for(const d in o.daily||{}){if(newer(dailyData[d],o.daily[d])){dailyData[d]=o.daily[d];n++;}}
  for(const k in o.tense||{}){if(newer(tenseData[k],o.tense[k]))tenseData[k]=o.tense[k];}
  for(const v in o.verb||{}){const rv=o.verb[v];if(!rv||typeof rv!=='object')continue;if(!verbData[v])verbData[v]={};for(const k in rv){if(newer(verbData[v][k],rv[k])){verbData[v][k]=rv[k];}}}
  saveAll();updateSrsBadge();renderStatsContent();updateHeader();
  return n?`Backup restored — ${n} day${n===1?'':'s'} of history merged in.`:'Backup checked — this device already had everything in it.';
}

// Tap a button without stealing focus from the answer box, so the iPhone keyboard stays up
// and nothing on the page moves between questions.
function tapKeep(el,fn){
  let x=0,y=0,moved=false,touched=0;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];x=t.clientX;y=t.clientY;moved=false;},{passive:true});
  el.addEventListener('touchmove',e=>{const t=e.touches[0];if(Math.abs(t.clientX-x)>10||Math.abs(t.clientY-y)>10)moved=true;},{passive:true});
  el.addEventListener('touchend',e=>{if(moved)return;e.preventDefault();touched=Date.now();fn();},{passive:false});
  el.addEventListener('mousedown',e=>e.preventDefault());
  el.addEventListener('click',()=>{if(Date.now()-touched>600)fn();});
}

function checkMode1(){const ui=document.getElementById('mode1-ui');let aw=false;ui.querySelectorAll('.conj-input').forEach(inp=>{const tk=inp.dataset.tense,i=parseInt(inp.dataset.idx),exp=currentAnswers[tk][i];if(!exp||exp==='—')return;inp.classList.remove('correct','wrong','revealed');if(!inp.value.trim())return;const isImp=tk==='imperatif',pIdx=isImp?[1,3,4].indexOf(i):i;if(matchesAnswer(inp.value,exp,pIdx,isImp))inp.classList.add('correct');else{inp.classList.add('wrong');aw=true;}});const af=[...ui.querySelectorAll('.conj-input')].filter(i=>{const e=currentAnswers[i.dataset.tense][parseInt(i.dataset.idx)];return e&&e!=='—';}).every(i=>i.value.trim().length>0);if(af){if(!aw){sesCorrect++;streak++;}else{sesWrong++;streak=0;}updateScore();}}

  let vi=m2IsImp?[1,3,4]:[0,1,2,3,4,5];vi=vi.filter(i=>ans[i]&&ans[i]!=='—');
  const idx=rand(vi);
  if(m2IsImp){const j=[1,3,4].indexOf(idx);m2PIdx=j;m2PL=IMP_PRONOUNS[j];m2PE=IMP_PRONOUNS_EN[j];}
  else{m2PIdx=idx;m2PL=dp(PRONOUNS[idx],ans[idx]);m2PE=PRONOUNS_EN[idx];
    if(idx===2&&SET.includeOn){const pk=rand([['il','he'],['elle','she'],['on','one']]);m2PL=pk[0];m2PE=pk[1];}}
  m2Answer=ans[idx];m2Checked=false;renderMode2();
}

function scheduleAdvance(m,fn){clearTimeout(advTimer);advTimer=setTimeout(()=>{if(mode===m)fn();},SET.autoPlay?1900:1100);}

function checkMode2(){if(m2Checked)return;const inp=document.getElementById('m2-input'),fb=document.getElementById('m2-feedback');if(!inp.value.trim())return;const ok=matchesAnswer(inp.value,m2Answer,m2PIdx,m2IsImp);inp.classList.remove('correct','wrong');fb.classList.remove('ok','err');if(ok){inp.classList.add('correct');fb.classList.add('ok');fb.textContent='✓ Correct!';sesCorrect++;streak++;}else{inp.classList.add('wrong');fb.classList.add('err');fb.innerHTML=`✗ Answer: <strong>${m2Answer}</strong>`;sesWrong++;streak=0;}m2Checked=true;setCheckLabel('m2-check',true);updateScore();showAnswerAudio();recordResult(m2Verb,m2TKey,ok);

function getWeightedPickVocab(){
  const tot=(tenseData['vocab']||{total:0}).total||0;
  const blend=Math.min(1,tot/200);
  const PV=poolVerbs();
  const vW=PV.map(([v],i)=>{
    const fw=freqW(i);
    const vd=(verbData[v]||{})['vocab']||{total:0,correct:0};
    return fw*(1-blend)+perfW(vd.correct,vd.total)*blend*fw;
  });
  const vT=vW.reduce((a,b)=>a+b,0);
  let vR=Math.random()*vT,vI=0;
  for(let i=0;i<vW.length;i++){vR-=vW[i];if(vR<=0){vI=i;break;}}
  return PV[vI];
}


let m3Verb='',m3Meaning='',m3Checked=false;

function matchesMeaning(input,meaning){
  const ni=normCmp(input.trim());
  const parts=meaning.split(',').map(p=>p.trim());
  for(const part of parts){
    const clean=part.replace(/\(.*?\)/g,'').trim();
    const noTo=clean.replace(/^to /,'').trim();
    if(normCmp(clean)===ni||normCmp(noTo)===ni||normCmp('to '+noTo)===ni)return true;
  }
  return false;
}

function newMode3(){
  clearTimeout(advTimer);
  const p=getWeightedPickVocab();m3Verb=p[0];m3Meaning=p[1];m3Checked=false;renderMode3();
}

function renderMode3(){
  const ui=document.getElementById('mode3-ui');
  if(!document.getElementById('m3-input')){
    ui.innerHTML=`<div class="card quiz-card">

      <div class="m2-input-wrap"><input class="m2-input" id="m3-input" placeholder="English meaning" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"/><button class="btn primary" id="m3-check">Check</button></div>
      <div class="feedback" id="m3-feedback"></div>
      <div class="btn-row"><button class="btn" id="m3-reveal">Reveal</button><div class="answer-slot"></div><button class="btn" id="m3-next">Next →</button></div>
    </div>`;
    document.getElementById('m3-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(m3Checked)newMode3();else checkMode3();}});
    tapKeep(document.getElementById('m3-check'),()=>{if(m3Checked)newMode3();else checkMode3();});
    tapKeep(document.getElementById('m3-reveal'),revealMode3);
    tapKeep(document.getElementById('m3-next'),newMode3);
    const sp=document.getElementById('m3-speak');tapKeep(sp,()=>speak(m3Verb,sp));
  }
  document.getElementById('m3-verb').textContent=m3Verb;
  const inp=document.getElementById('m3-input'),fb=document.getElementById('m3-feedback');
  inp.value='';inp.className='m2-input';fb.className='feedback';fb.textContent='';setCheckLabel('m3-check',false);
  try{inp.focus({preventScroll:true});}catch(e){inp.focus();}
}

function checkMode3(){
  if(m3Checked)return;
  const inp=document.getElementById('m3-input'),fb=document.getElementById('m3-feedback');
  if(!inp.value.trim())return;
  const ok=matchesMeaning(inp.value,m3Meaning);
  inp.classList.remove('correct','wrong');fb.classList.remove('ok','err');
  if(ok){inp.classList.add('correct');fb.classList.add('ok');fb.textContent='✓ Correct!';sesCorrect++;streak++;}
  else{inp.classList.add('wrong');fb.classList.add('err');fb.innerHTML=`✗ Accepted: <strong>${m3Meaning}</strong>`;sesWrong++;streak=0;}
  m3Checked=true;setCheckLabel('m3-check',true);updateScore();recordResult(m3Verb,'vocab',ok);
  if(SET.autoPlay)speak(m3Verb,document.getElementById('m3-speak'));
  if(ok&&SET.autoAdvance)scheduleAdvance(3,()=>{if(m3Checked)newMode3();});
}

function revealMode3(){
  const inp=document.getElementById('m3-input'),fb=document.getElementById('m3-feedback');
  inp.value=m3Meaning;inp.classList.remove('correct','wrong');inp.classList.add('revealed');
  fb.classList.remove('ok','err');fb.textContent='';m3Checked=true;setCheckLabel('m3-check',true);
}


let suggHighlight=-1;
function filterVerbSuggestions(){
  const inp=document.getElementById('mode1-verb-input');
  const q=normCmp(inp.value.trim());
  const box=document.getElementById('verb-suggestions');
  if(!q){box.style.display='none';return;}
  const matches=VRAW.filter(([v])=>normCmp(v).startsWith(q)).slice(0,12);
  if(!matches.length){box.style.display='none';return;}
  suggHighlight=-1;
  box.innerHTML=matches.map(([v,m],i)=>`<div class="verb-sugg-item" data-verb="${v}" data-idx="${i}"
    style="padding:7px 14px;cursor:pointer;font-size:14px;border-bottom:0.5px solid var(--border);"
    onmousedown="selectVerb('${v}')" onmouseover="highlightSugg(${i})">${v} <span style="font-size:12px;color:var(--text3);font-style:italic;">${m}</span></div>`).join('');
  box.style.display='block';
}
function highlightSugg(i){
  suggHighlight=i;
  document.querySelectorAll('.verb-sugg-item').forEach((el,j)=>{el.style.background=j===i?'var(--bg2)':'';});
}
function verbInputKey(e){
  const items=document.querySelectorAll('.verb-sugg-item');
  if(e.key==='ArrowDown'){e.preventDefault();highlightSugg(Math.min(suggHighlight+1,items.length-1));}
  else if(e.key==='ArrowUp'){e.preventDefault();highlightSugg(Math.max(suggHighlight-1,0));}
  else if(e.key==='Enter'){
    e.preventDefault();
    if(suggHighlight>=0&&items[suggHighlight]){selectVerb(items[suggHighlight].dataset.verb);}
    else{const q=normCmp(document.getElementById('mode1-verb-input').value.trim());const m=VRAW.find(([v])=>normCmp(v)===q);if(m)selectVerb(m[0]);}
  } else if(e.key==='Escape'){closeSuggestions();}
}
function selectVerb(v){
  const inp=document.getElementById('mode1-verb-input');
  inp.value=v;closeSuggestions();currentVerb=v;currentAnswers={};
  TENSES.forEach(t=>{currentAnswers[t.key]=conj(currentVerb,t.key);});renderMode1();
}
function closeSuggestions(){document.getElementById('verb-suggestions').style.display='none';}
function pickRandomVerb(){
  const p=rand(poolVerbs());
  document.getElementById('mode1-verb-input').value=p[0];
  selectVerb(p[0]);
}
